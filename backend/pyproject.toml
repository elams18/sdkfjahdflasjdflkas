[project]
name = "wind-forecast-api"
version = "0.1.0"
description = "Cutoff-aware Elexon wind forecast analysis API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false